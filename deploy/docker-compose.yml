version: "3.8"

networks:
  axiom-mesh:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Axiom API Gateway & SCORE Reasoning Engine
  # ----------------------------------------------------------------------------
  axiom-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: axiom-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Axiom Enterprise API
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axiom-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Qdrant Vector Engine (Distributed Hybrid Search)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: axiom-qdrant-engine
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - axiom-mesh
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis Cache & Fast State Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: axiom-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - axiom-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
