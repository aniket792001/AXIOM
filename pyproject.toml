[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-rag"
version = "0.1.0"
description = "Axiom: Production-grade self-correcting RAG platform powered by the SCORE engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Axiom Core Team" }
]
keywords = [
    "rag",
    "agentic-rag",
    "langgraph",
    "langchain",
    "fastapi",
    "self-correcting",
    "zero-hallucination",
    "qdrant"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    # Core Agentic & Graph Orchestration
    "langgraph>=0.2.34",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # API Gateway & Real-Time Streaming
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",

    # Hybrid Search, Vector Stores & Re-ranking
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "cohere>=5.11.0",
    "tiktoken>=0.7.0",

    # Web Search & Tooling Fallback
    "tavily-python>=0.5.0",
    "httpx>=0.27.2",

    # Utilities & Resilience
    "tenacity>=9.0.0",
    "jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "ragas>=0.2.0"
]
evals = [
    "ragas>=0.2.0",
    "datasets>=3.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
